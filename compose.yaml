services:
  api:
    build: .
    image: ghcr.io/iyoroy-network/dn42-autopeer-backend:main
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      # Use a dedicated clean checkout in real deployments.
      - ../Bird2-Configuration:/config-repo
      - ./data:/data/autopeer
      # Public Kioubit verification key and optional metrics target configuration.
      - ./config:/config:ro
      # Mount only dedicated deployment secrets in production.
      - ./secrets:/run/secrets:ro

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/iyoroy-network/dn42-autopeer-frontend:main
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
